name: TDS GA7 Release Gate

on:
  push:
    branches:
      - main

jobs:
  test:

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: none

    steps:
      - uses: actions/checkout@v4

      - name: TDS identity: 24f1002052@ds.study.iitm.ac.in
        run: echo "24f1002052@ds.study.iitm.ac.in"

      - uses: actions/setup-python@v5

      - run: |
          python -m pip install -r requirements.txt

      - run: |
          pytest